name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project structure
        run: |
          flutter create . --platforms=android --org com.example

      - name: Configure Gradle Desugaring
        run: |
          python3 -c "
          import os

          # البحث عن ملف build.gradle الخاص بالتطبيق
          path_gradle = 'android/app/build.gradle'
          path_kts = 'android/app/build.gradle.kts'

          target_file = path_gradle if os.path.exists(path_gradle) else path_kts

          if os.path.exists(target_file):
              with open(target_file, 'r') as f:
                  content = f.read()

              # تفعيل coreLibraryDesugaring
              if 'compileOptions' in content and 'coreLibraryDesugaringEnabled' not in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        coreLibraryDesugaringEnabled true')

              if 'dependencies {' in content and 'desugar_jdk_libs' not in content:
                  content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n    implementation(\"com.android.tools:desugar_jdk_libs:2.0.4\")')

              with open(target_file, 'w') as f:
                  f.write(content)
          "

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
