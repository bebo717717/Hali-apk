name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project structure
        run: |
          flutter create . --platforms=android --org com.example

      - name: Configure Gradle Desugaring
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
          sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
